databases:
  - name: arkhana-db
    plan: free
    region: oregon

services:
  - type: web
    name: arkhana
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:push && pnpm db:seed
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arkhana-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
    previews:
      generation: automatic
