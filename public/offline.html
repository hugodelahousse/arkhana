<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Arkhana</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #0a0a0f;
        color: #b0aca6;
        font-family: Georgia, serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      .card-frame {
        width: 160px;
        height: 280px;
        border: 1px solid #303038;
        border-radius: 8px;
        margin: 0 auto 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background: #13131a;
      }

      .card-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.85;
      }

      .card-frame::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid #303038;
        border-radius: 4px;
        z-index: 1;
        pointer-events: none;
      }

      h1 {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.2em;
        color: #e8e4de;
        margin-bottom: 1rem;
      }

      p {
        font-size: 0.875rem;
        letter-spacing: 0.05em;
        opacity: 0.6;
        max-width: 28ch;
        line-height: 1.7;
        margin-bottom: 0.5rem;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #b0aca6;
        text-decoration: none;
        opacity: 0.4;
        transition: opacity 0.2s;
      }

      a:hover { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="card-frame">
      <img src="/cards/moon.jpg" alt="The Moon" />
    </div>
    <h1>XVIII · The Moon</h1>
    <p>The cards cannot reach you here.</p>
    <p>Return when the connection is restored.</p>
    <a href="/" onclick="event.preventDefault(); history.back()">← Return</a>
  </body>
</html>
