<title>Arkhana — Card Layer PoC · Page of Cups</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a12;
    color: #c4b5a0;
    font-family: 'Georgia', serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem 1rem;
    user-select: none;
    overflow-x: hidden;
  }

  h1 {
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .4;
    font-weight: 400;
  }

  /* ── Scene ── */
  .scene {
    perspective: 1200px;
    width: 240px;
    --rx: .5;
    --ry: .5;
  }

  .tilt {
    transform-style: preserve-3d;
    width: 100%;
    aspect-ratio: 350/600;
    position: relative;
    border-radius: 8px;
  }

  /* ── Card layers ── */
  .layer {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* Background: darker, sluggish, moves opposite tilt */
  .layer-bg {
    z-index: 1;
    filter: brightness(.55) blur(1px) saturate(.8);
    transform: scale(1.08);
    will-change: transform;
  }

  /* ── Glare ── */
  .layer-glare {
    position: absolute;
    inset: 0;
    z-index: 4;
    border-radius: 8px;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: var(--glare-opacity, .2);
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem 1.5rem;
    justify-content: center;
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .7;
  }

  .ctrl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3rem;
  }

  input[type=range] {
    accent-color: #8b6f5c;
    width: 90px;
  }

  .toggle-row {
    display: flex;
    gap: 1rem;
  }

  label.toggle {
    display: flex;
    align-items: center;
    gap: .4rem;
    cursor: pointer;
    opacity: .6;
    transition: opacity .2s;
  }
  label.toggle:has(input:checked) { opacity: 1; }
  label.toggle input { accent-color: #8b6f5c; }

  .hint {
    font-size: .6rem;
    letter-spacing: .1em;
    opacity: .3;
    text-align: center;
  }
</style>

// ── Pointer (desktop) ─────────────────────────────────────────
scene.addEventListener('mousemove', e => {
  if (gyroActive) return;
  const r = scene.getBoundingClientRect();
  applyTilt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
});
scene.addEventListener('mouseleave', () => {
  if (!gyroActive) applyTilt(.5, .5);
});

// ── Gyro (mobile) ─────────────────────────────────────────────
function bindGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma === null) return;
    gyroActive = true;
    const rx = Math.max(0, Math.min(1, (e.gamma / 45 + 1) / 2));
    const ry = Math.max(0, Math.min(1, ((e.beta - 45) / 45 + 1) / 2));
    applyTilt(rx, ry);
  }, { passive: true });
}
bindGyro();

// iOS permission tap
scene.addEventListener('click', () => {
  const DE = window.DeviceOrientationEvent;
  if (DE && typeof DE.requestPermission === 'function') {
    DE.requestPermission().then(s => { if (s === 'granted') bindGyro(); });
  }
});

// ── Core tilt logic ───────────────────────────────────────────
let targetRx = .5, targetRy = .5, curRx = .5, curRy = .5;

function applyTilt(rx, ry) {
  targetRx = rx; targetRy = ry;
  if (!animFrame) animFrame = requestAnimationFrame(animate);
}

function animate() {
  animFrame = null;
  const ease = gyroActive ? 0.18 : 0.22;
  curRx += (targetRx - curRx) * ease;
  curRy += (targetRy - curRy) * ease;

  const nx = curRx * 2 - 1;
  const ny = curRy * 2 - 1;
  tilt.style.transform = `rotateX(${(-ny * 14).toFixed(2)}deg) rotateY(${(nx * 14).toFixed(2)}deg)`;

  const ox = (curRx - .5) * depth;
  const oy = (curRy - .5) * depth;
  bg.style.transform    = `translate(${(-ox * .7).toFixed(1)}px,${(-oy * .7).toFixed(1)}px) scale(1.08)`;
  fg.style.transform    = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px)`;
  shine.style.transform = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px)`;
  shine.style.backgroundPosition = `${(curRx*100).toFixed(1)}% ${(curRy*100).toFixed(1)}%, ${(curRx*100).toFixed(1)}% ${(curRy*100).toFixed(1)}%`;
  glare.style.background = `radial-gradient(farthest-corner circle at ${(curRx*100).toFixed(1)}% ${(curRy*100).toFixed(1)}%, hsla(0,0%,100%,.85) 0%, hsla(0,0%,100%,.4) 20%, hsla(0,0%,0%,.5) 80%)`;

  // Keep animating if not settled
  if (Math.abs(curRx - targetRx) > .001 || Math.abs(curRy - targetRy) > .001) {
    animFrame = requestAnimationFrame(animate);
  }
}

// ── Controls ─────────────────────────────────────────────────
document.getElementById('depthCtrl').addEventListener('input', e => {
  depth = +e.target.value;
});
document.getElementById('foilCtrl').addEventListener('input', e => {
  scene.style.setProperty('--shine-opacity', e.target.value);
});
document.getElementById('glareCtrl').addEventListener('input', e => {
  scene.style.setProperty('--glare-opacity', e.target.value);
});
document.getElementById('maskToggle').addEventListener('change', e => {
  const v = e.target.checked ? `url("${MASK_SRC}")` : 'none';
  [fg, shine].forEach(el => {
    el.style.webkitMaskImage = v;
    el.style.maskImage = v;
  });
});
document.getElementById('bgToggle').addEventListener('change', e => {
  bg.style.opacity = e.target.checked ? '1' : '0';
});
</script>
