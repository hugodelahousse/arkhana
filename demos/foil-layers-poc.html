<title>Arkhana — Card Layer PoC · Page of Cups</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a12;
    color: #c4b5a0;
    font-family: 'Georgia', serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem 1rem;
    user-select: none;
    overflow-x: hidden;
  }

  h1 {
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .4;
    font-weight: 400;
  }

  /* ── Scene ── */
  .scene {
    perspective: 1200px;
    width: 240px;
    --rx: .5;
    --ry: .5;
  }

  .tilt {
    transform-style: preserve-3d;
    width: 100%;
    aspect-ratio: 350/600;
    position: relative;
    border-radius: 8px;
    overflow: visible;
  }

  /* ── Card layers ── */
  .layer {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    overflow: hidden;
  }

  /* Background: darker, sluggish, moves opposite tilt */
  .layer-bg {
    z-index: 1;
    filter: brightness(.55) blur(1px) saturate(.8);
    transform:
      translate(
        calc((var(--rx) - .5) * -16px),
        calc((var(--ry) - .5) * -16px)
      )
      scale(1.08);
    will-change: transform;
    transition: transform 80ms linear;
    border-radius: 8px;
  }

  /* ── Foil shine — masked to subject ── */
  .layer-shine {
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: 8px;
    pointer-events: none;
    mix-blend-mode: color-dodge;
    opacity: var(--shine-opacity, .4);
    will-change: transform, opacity;
    transition: opacity .3s;

    /* Conic galaxy foil */
    background:
      url("https://cdn.jsdelivr.net/gh/simeydotme/pokemon-cards-css@main/public/img/glitter.png") 50% 50% / 25% auto,
      conic-gradient(
        from calc(var(--rx) * 360deg),
        hsl(2,100%,73%), hsl(53,100%,69%), hsl(93,100%,69%),
        hsl(176,100%,76%), hsl(228,100%,74%), hsl(283,100%,73%), hsl(2,100%,73%)
      );
    background-blend-mode: soft-light;
    background-size: 25%, 200% 200%;
    background-position:
      calc(var(--rx) * 100%) calc(var(--ry) * 100%),

  /* ── Glare ── */
  .layer-glare {
    position: absolute;
    inset: 0;
    z-index: 4;
    border-radius: 8px;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: var(--glare-opacity, .2);
    background: radial-gradient(
      farthest-corner circle at calc(var(--rx) * 100%) calc(var(--ry) * 100%),
      hsla(0,0%,100%,.9) 0%,
      hsla(0,0%,100%,.5) 15%,
      hsla(0,0%,0%,.5) 80%
    );
    will-change: background;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem 1.5rem;
    justify-content: center;
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .7;
  }

  .ctrl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3rem;
  }

  input[type=range] {
    accent-color: #8b6f5c;
    width: 90px;
  }

  .toggle-row {
    display: flex;
    gap: 1rem;
  }

  label.toggle {
    display: flex;
    align-items: center;
    gap: .4rem;
    cursor: pointer;
    opacity: .6;
    transition: opacity .2s;
  }
  label.toggle:has(input:checked) { opacity: 1; }
  label.toggle input { accent-color: #8b6f5c; }

  .hint {
    font-size: .6rem;
    letter-spacing: .1em;
    opacity: .3;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Arkhana · Card Layer PoC · Page of Cups</h1>

<div class="scene" id="scene">
  <div class="tilt" id="tilt">
    <img class="layer layer-bg" id="bg" src="https://cdn.jsdelivr.net/gh/metabismuth/tarot-json@master/cards/c11.jpg" alt="">
    <img class="layer layer-fg" id="fg" src="https://cdn.jsdelivr.net/gh/metabismuth/tarot-json@master/cards/c11.jpg" alt="">
    <div class="layer-shine" id="shine"></div>
    <div class="layer-glare" id="glare"></div>
  </div>
</div>

<div class="controls">
  <div class="ctrl">
    Parallax depth
    <input type="range" id="depth" min="0" max="30" value="18" step="1">
  </div>
  <div class="ctrl">
    Foil intensity
    <input type="range" id="foil" min="0" max="1" value=".4" step=".05">
  </div>
  <div class="ctrl">
    Glare
    <input type="range" id="glareCtrl" min="0" max=".6" value=".2" step=".05">
  </div>

  <div class="toggle-row">
    <label class="toggle">
      <input type="checkbox" id="maskToggle" checked> Mask
    </label>
    <label class="toggle">
      <input type="checkbox" id="bgToggle" checked> BG layer
    </label>
  </div>
</div>

<p class="hint">Mouse / tilt phone to interact · Mask confines foil to subject</p>

<script>
const scene = document.getElementById('scene');
const tilt  = document.getElementById('tilt');
const bg    = document.getElementById('bg');
const fg    = document.getElementById('fg');
const shine = document.getElementById('shine');
const glare = document.getElementById('glare');

let depth = 18;
let gyroActive = false;

// ── Pointer-based tilt (desktop) ──────────────────────────────
scene.addEventListener('mousemove', e => {
  if (gyroActive) return;
  const r = scene.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  applyTilt(nx, ny);
});

scene.addEventListener('mouseleave', () => {
  if (gyroActive) return;
  applyTilt(.5, .5, true);
});

// ── Tap to request gyro permission (iOS) ─────────────────────
scene.addEventListener('click', () => {
  const DE = window.DeviceOrientationEvent;
  if (DE && typeof DE.requestPermission === 'function') {
    DE.requestPermission().then(s => { if (s === 'granted') bindGyro(); });
  }
});

// ── Device orientation (mobile) ──────────────────────────────
function bindGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma === null || e.beta === null) return;
    gyroActive = true;
    const nx = Math.max(0, Math.min(1, (e.gamma / 45 + 1) / 2));
    const ny = Math.max(0, Math.min(1, ((e.beta - 45) / 45 + 1) / 2));
    applyTilt(nx, ny);
  }, { passive: true });
}
bindGyro();

// ── Apply tilt ────────────────────────────────────────────────
let currentRx = .5, currentRy = .5;

function applyTilt(rx, ry, reset = false) {
  currentRx = rx;
  currentRy = ry;
  const nx = rx * 2 - 1;  // -1..1
  const ny = ry * 2 - 1;

  // 3D rotation
  if (!reset) {
    tilt.style.transform = `rotateX(${(-ny * 15).toFixed(1)}deg) rotateY(${(nx * 15).toFixed(1)}deg)`;
  } else {
    tilt.style.transform = '';
  }

  // CSS vars for layers
  scene.style.setProperty('--rx', rx.toFixed(4));
  scene.style.setProperty('--ry', ry.toFixed(4));
  updateLayers(rx, ry);
}

function updateLayers(rx, ry) {
  const ox = (rx - .5) * depth;
  const oy = (ry - .5) * depth;

  bg.style.transform    = `translate(${(-ox * .7).toFixed(1)}px, ${(-oy * .7).toFixed(1)}px) scale(1.08)`;
  fg.style.transform    = `translate(${(ox).toFixed(1)}px, ${(oy).toFixed(1)}px)`;
  shine.style.transform = `translate(${(ox).toFixed(1)}px, ${(oy).toFixed(1)}px)`;
  shine.style.backgroundPosition = `${(rx * 100).toFixed(1)}% ${(ry * 100).toFixed(1)}%, ${(rx * 100).toFixed(1)}% ${(ry * 100).toFixed(1)}%`;
  glare.style.background = `radial-gradient(farthest-corner circle at ${(rx*100).toFixed(1)}% ${(ry*100).toFixed(1)}%, hsla(0,0%,100%,.9) 0%, hsla(0,0%,100%,.5) 15%, hsla(0,0%,0%,.5) 80%)`;
}

// ── Controls ─────────────────────────────────────────────────
document.getElementById('depth').addEventListener('input', e => {
  depth = +e.target.value;
  bg.style.setProperty('transform', '');
  fg.style.setProperty('transform', '');
  updateLayers(currentRx, currentRy);
});

document.getElementById('foil').addEventListener('input', e => {
  scene.style.setProperty('--shine-opacity', e.target.value);
});

document.getElementById('glareCtrl').addEventListener('input', e => {
  scene.style.setProperty('--glare-opacity', e.target.value);
});
