<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arkhana — Card Layer PoC · Page of Cups</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a12;
    color: #c4b5a0;
    font-family: Georgia, serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 1.5rem;
    padding: 2rem 1rem 3rem;
    user-select: none;
    overflow-x: hidden;
  }
  h1 {
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .35;
    font-weight: 400;
    text-align: center;
  }

  /* ─── Tab switcher ─── */
  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid #2a2a3a;
    border-radius: 4px;
    overflow: hidden;
    font-size: .6rem;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .tab {
    padding: .4rem .9rem;
    background: transparent;
    border: none;
    color: #7a7a9a;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .tab.active { background: #1e1e2e; color: #c4b5a0; }

  /* ─── Gyro permission button ─── */
  #gyroBtn {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem 1.2rem;
    background: transparent;
    border: 1px solid #3a3a5a;
    color: #8a8aaa;
    font-family: Georgia, serif;
    font-size: .65rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: border-color .2s, color .2s;
  }
  #gyroBtn:hover { border-color: #6a6a9a; color: #b4b4d0; }
  #gyroBtn.granted { border-color: #3a6a4a; color: #6aaa8a; pointer-events: none; }
  #gyroBtn.hidden { display: none; }

  /* ─── Card scene ─── */
  .scene {
    perspective: 1200px;
    width: 220px;
  }
  @media (min-height: 750px) { .scene { width: 260px; } }

  .tilt {
    transform-style: preserve-3d;
    width: 100%;
    aspect-ratio: 350/600;
    position: relative;
    border-radius: 8px;
    transition: transform 80ms linear;
  }
  .layer {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .layer-bg {
    z-index: 1;
    filter: brightness(.5) blur(1.5px) saturate(.7);
  }

  .layer-glare {
    position: absolute;
    inset: 0;
    z-index: 4;
    border-radius: 8px;
    pointer-events: none;

  /* ─── Mask preview panel ─── */
  .mask-panel {
    width: 100%;
    max-width: 360px;
    display: none;
    flex-direction: column;
    gap: .75rem;
    align-items: center;
  }
  .mask-panel.visible { display: flex; }
  .mask-panel img { width: 100%; border-radius: 6px; border: 1px solid #1e1e2e; }
  .mask-caption {
    font-size: .6rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .35;
    text-align: center;
  }

  /* ─── Controls ─── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: .6rem 1.2rem;
    justify-content: center;
    font-size: .6rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .7;
  }
  .ctrl { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
  input[type=range] { accent-color: #8b6f5c; width: 80px; }

// ── Gyro permission button ────────────────────────────────────
gyroBtn.addEventListener('click', async () => {
  const DE = window.DeviceOrientationEvent;
  if (DE && typeof DE.requestPermission === 'function') {
    // iOS 13+ requires explicit permission
    try {
      const state = await DE.requestPermission();
      if (state === 'granted') {
        gyroBtn.textContent = '✦ Tilt active';
        gyroBtn.classList.add('granted');
        startGyro();
      }
    } catch(e) {
      gyroBtn.textContent = 'Permission denied';
    }
  } else {
    // Android / desktop — no permission needed
    gyroBtn.classList.add('hidden');
    startGyro();
  }
});

// Auto-start on Android (no permission prompt)
if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission !== 'function') {
  startGyro();
  gyroBtn.classList.add('hidden');
}

function startGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma === null || e.beta === null) return;
    gyroActive = true;
    tgtRx = Math.max(0, Math.min(1, (e.gamma / 40 + 1) / 2));
    tgtRy = Math.max(0, Math.min(1, ((e.beta - 45) / 40 + 1) / 2));
    if (!raf) raf = requestAnimationFrame(tick);
  }, { passive: true });
}

// ── Mouse fallback ────────────────────────────────────────────
scene.addEventListener('mousemove', e => {
  if (gyroActive) return;
  const r = scene.getBoundingClientRect();
  tgtRx = (e.clientX - r.left) / r.width;
  tgtRy = (e.clientY - r.top)  / r.height;
  if (!raf) raf = requestAnimationFrame(tick);
});
scene.addEventListener('mouseleave', () => {
  if (gyroActive) return;
  tgtRx = .5; tgtRy = .5;
  if (!raf) raf = requestAnimationFrame(tick);
});

// ── Animation loop ────────────────────────────────────────────
function tick() {
  raf = null;
  const ease = .15;
  curRx += (tgtRx - curRx) * ease;
  curRy += (tgtRy - curRy) * ease;

  const nx = curRx * 2 - 1;
  const ny = curRy * 2 - 1;
  tilt.style.transform = `rotateX(${(-ny * 14).toFixed(2)}deg) rotateY(${(nx * 14).toFixed(2)}deg)`;

  const ox = (curRx - .5) * depth;
  const oy = (curRy - .5) * depth;

  bg.style.transform = `translate(${(-ox * .6).toFixed(1)}px,${(-oy * .6).toFixed(1)}px) scale(1.08)`;
  fg.style.transform = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px)`;
  shine.style.transform = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px)`;
  shine.style.backgroundPosition = `${(curRx*100).toFixed(1)}% ${(curRy*100).toFixed(1)}%`;
  glare.style.background = `radial-gradient(farthest-corner circle at ${(curRx*100).toFixed(1)}% ${(curRy*100).toFixed(1)}%, hsla(0,0%,100%,.85) 0%, hsla(0,0%,100%,.4) 18%, hsla(0,0%,0%,.55) 80%)`;

  const settling = Math.abs(curRx-tgtRx) > .001 || Math.abs(curRy-tgtRy) > .001;
  if (settling || gyroActive) raf = requestAnimationFrame(tick);
}

// ── Controls ─────────────────────────────────────────────────
document.getElementById('depthCtrl').addEventListener('input', e => depth = +e.target.value);
document.getElementById('foilCtrl').addEventListener('input', e => scene.style.setProperty('--shine-opacity', e.target.value));
document.getElementById('glareCtrl').addEventListener('input', e => scene.style.setProperty('--glare-opacity', e.target.value));
document.getElementById('maskToggle').addEventListener('change', e => {
  const v = e.target.checked ? `url("${MASK_SRC}")` : 'none';
  [fg, shine].forEach(el => {
    el.style.webkitMaskImage = v;
    el.style.maskImage = v;
  });
});
document.getElementById('bgToggle').addEventListener('change', e => bg.style.opacity = e.target.checked ? '1' : '0');

// ── Tabs ─────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('cardView').style.display  = tab === 'card' ? '' : 'none';
    document.getElementById('maskView').classList.toggle('visible', tab === 'mask');
    document.getElementById('cardControls').style.display = tab === 'card' ? '' : 'none';
  });
});
</script>
</body>
