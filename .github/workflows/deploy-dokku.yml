name: Deploy to Dokku

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      domain:
        required: true
        type: string
      image_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      tag_latest:
        required: false
        type: boolean
        default: false
      run_seed:
        required: false
        type: boolean
        default: false
      use_migrate_deploy:
        required: false
        type: boolean
        default: false

env:
  APP_NAME: ${{ inputs.app_name }}
  IMAGE_NAME: ${{ inputs.image_name }}
  DOMAIN: ${{ inputs.domain }}

jobs:
  create-deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    steps:
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        continue-on-error: true
        with:
          token: ${{ github.token }}
          environment: ${{ inputs.environment }}
          environment-url: https://${{ inputs.domain }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          if [ "${{ inputs.tag_latest }}" = "true" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

      - name: Setup app
        run: |
          ssh dokku@${{ secrets.DOKKU_HOST }} -- arkhana-ci:setup \
            ${{ env.APP_NAME }} \
            ${{ env.DOMAIN }}

      - name: Set config
        run: |
          ssh dokku@${{ secrets.DOKKU_HOST }} -- config:set --no-restart ${{ env.APP_NAME }} \
            NODE_ENV=production \
            BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}' \
            BETTER_AUTH_URL='https://${{ env.DOMAIN }}'

  deploy:
    runs-on: ubuntu-latest
    needs: [create-deployment, build, setup]
    if: always() && needs.build.result == 'success' && needs.setup.result == 'success'
    permissions:
      deployments: write
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          DB_ACTION=$([[ "${{ inputs.use_migrate_deploy }}" == "true" ]] && echo "migrate" || echo "push")
          SEED=$([[ "${{ inputs.run_seed }}" == "true" ]] && echo "seed" || echo "")
          ssh dokku@${{ secrets.DOKKU_HOST }} -- arkhana-ci:deploy \
            ${{ env.APP_NAME }} \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            $DB_ACTION \
            $SEED

      - name: Update deployment status (success)
        if: success() && needs.create-deployment.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          environment-url: https://${{ inputs.domain }}
          state: success
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}

      - name: Update deployment status (failure)
        if: failure() && needs.create-deployment.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          state: failure
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
