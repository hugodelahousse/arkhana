name: Deploy to Dokku

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      domain:
        required: true
        type: string
      image_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      tag_latest:
        required: false
        type: boolean
        default: false
      run_seed:
        required: false
        type: boolean
        default: false
      use_migrate_deploy:
        required: false
        type: boolean
        default: false

env:
  APP_NAME: ${{ inputs.app_name }}
  IMAGE_NAME: ${{ inputs.image_name }}
  DOMAIN: ${{ inputs.domain }}

jobs:
  create-deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    steps:
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        continue-on-error: true
        with:
          token: ${{ github.token }}
          environment: ${{ inputs.environment }}
          environment-url: https://${{ inputs.domain }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          if [ "${{ inputs.tag_latest }}" = "true" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

      - name: Create app if needed
        run: ssh dokku@${{ secrets.DOKKU_HOST }} apps:exists ${{ env.APP_NAME }} 2>/dev/null || ssh dokku@${{ secrets.DOKKU_HOST }} apps:create ${{ env.APP_NAME }}

      - name: Create and link postgres
        run: |
          ssh dokku@${{ secrets.DOKKU_HOST }} postgres:exists ${{ env.APP_NAME }}-db 2>/dev/null || ssh dokku@${{ secrets.DOKKU_HOST }} postgres:create ${{ env.APP_NAME }}-db
          ssh dokku@${{ secrets.DOKKU_HOST }} postgres:link ${{ env.APP_NAME }}-db ${{ env.APP_NAME }} || true

      - name: Set config
        run: |
          ssh dokku@${{ secrets.DOKKU_HOST }} config:set --no-restart ${{ env.APP_NAME }} \
            NODE_ENV=production \
            BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
            BETTER_AUTH_URL="https://${{ env.DOMAIN }}"

      - name: Setup domain
        run: |
          ssh dokku@${{ secrets.DOKKU_HOST }} domains:set ${{ env.APP_NAME }} ${{ env.DOMAIN }} || true
          ssh dokku@${{ secrets.DOKKU_HOST }} ports:add ${{ env.APP_NAME }} http:80:3000 || true

      - name: Enable SSL
        continue-on-error: true
        run: ssh dokku@${{ secrets.DOKKU_HOST }} letsencrypt:enable ${{ env.APP_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: [create-deployment, build, setup]
    if: always() && needs.build.result == 'success' && needs.setup.result == 'success'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        run: ssh dokku@${{ secrets.DOKKU_HOST }} git:from-image ${{ env.APP_NAME }} ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose database port
        run: ssh dokku@${{ secrets.DOKKU_HOST }} postgres:expose ${{ env.APP_NAME }}-db || true

      - name: Run database migrations and seed
        run: |
          set -e

          DSN=$(ssh dokku@${{ secrets.DOKKU_HOST }} postgres:info ${{ env.APP_NAME }}-db --dsn)
          DB_PASS=$(echo "$DSN" | sed -n 's|postgres://[^:]*:\([^@]*\)@.*|\1|p' | tr -d '[:space:]')
          DB_NAME=$(echo "$DSN" | sed -n 's|postgres://[^/]*/\(.*\)|\1|p' | tr -d '[:space:]')
          EXPOSED_PORT=$(ssh dokku@${{ secrets.DOKKU_HOST }} postgres:info ${{ env.APP_NAME }}-db --exposed-ports | sed 's/.*->//' | tr -d '[:space:]')

          export DATABASE_URL="postgres://postgres:${DB_PASS}@${{ secrets.DOKKU_HOST }}:${EXPOSED_PORT}/${DB_NAME}"

          if [ "${{ inputs.use_migrate_deploy }}" = "true" ]; then
            pnpm db:migrate
          else
            pnpm db:push --force
          fi

          if [ "${{ inputs.run_seed }}" = "true" ]; then
            pnpm db:seed
          fi

      - name: Unexpose database port
        if: always()
        run: ssh dokku@${{ secrets.DOKKU_HOST }} postgres:unexpose ${{ env.APP_NAME }}-db || true

      - name: Update deployment status (success)
        if: success() && needs.create-deployment.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          environment-url: https://${{ inputs.domain }}
          state: success
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}

      - name: Update deployment status (failure)
        if: failure() && needs.create-deployment.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          state: failure
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
